

name: SQL Quiz Database Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-database-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --upgrade pip psycopg2-binary

      - name: Test Supabase connection using GitHub Secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2

          required = [
              "DB_HOST",
              "DB_PORT",
              "DB_NAME",
              "DB_USER",
              "DB_PASSWORD",
              "DB_SSLMODE",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name)
          ]

          if missing:
              print(
                  "Missing required GitHub Secrets: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          try:
              connection = psycopg2.connect(
                  host=os.environ["DB_HOST"],
                  port=int(os.environ["DB_PORT"]),
                  dbname=os.environ["DB_NAME"],
                  user=os.environ["DB_USER"],
                  password=os.environ["DB_PASSWORD"],
                  sslmode=os.environ["DB_SSLMODE"],
                  connect_timeout=15,
                  options="-c statement_timeout=5000",
              )

              try:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          "SELECT current_user, current_database()"
                      )
                      database_user, database_name = cursor.fetchone()

                  print("Database connection successful.")
                  print(f"Connected database: {database_name}")
                  print(f"Connected role: {database_user}")
              finally:
                  connection.close()

          except Exception as error:
              print("Database connection failed.")
              print(f"Error type: {type(error).__name__}")
              sys.exit(1)
          PY
